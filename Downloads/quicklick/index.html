<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quicklick – Your Daily Essentials, Delivered!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ----- RESET & BASE (unchanged) ----- */
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary-dark-blue: #002060;
            --primary-blue: #0038B8;
            --bright-blue: #0080F0;
            --sky-blue: #00B8F0;
            --primary-orange: #F06000;
            --bright-orange: #FF8000;
            --dark-text: #0B1736;
            --white: #FFFFFF;
            --light-blue-bg: #F3F8FF;
            --light-orange-bg: #FFF4EA;
            --blue-gradient: linear-gradient(135deg, #0038B8 0%, #0080F0 100%);
            --orange-gradient: linear-gradient(135deg, #F06000 0%, #FF8000 100%);
            --shadow: 0 20px 60px rgba(0,0,0,0.08);
            --shadow-hover: 0 30px 80px rgba(0,0,0,0.12);
            --shadow-blue: 0 10px 30px rgba(0,56,184,0.30);
            --shadow-orange: 0 10px 30px rgba(240,96,0,0.30);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
        }
        html { scroll-behavior:smooth; }
        body { font-family:'Inter', sans-serif; background:var(--white); color:var(--dark-text); line-height:1.6; overflow-x:hidden; }
        a { text-decoration:none; color:inherit; }
        img { max-width:100%; display:block; }
        .container { max-width:1200px; margin:0 auto; padding:0 24px; }

        /* ----- BUTTONS (unchanged) ----- */
        .btn-primary {
            display:inline-flex; align-items:center; gap:10px;
            background:var(--blue-gradient);
            color:var(--white);
            padding:14px 36px; border-radius:50px;
            font-weight:700; font-size:0.95rem; border:none; cursor:pointer;
            transition:var(--transition);
            box-shadow:var(--shadow-blue);
            letter-spacing:0.3px;
        }
        .btn-primary:hover { transform:translateY(-4px) scale(1.03); box-shadow:0 16px 40px rgba(0,56,184,0.45); }

        .btn-secondary {
            display:inline-flex; align-items:center; gap:10px;
            background:var(--white); color:var(--primary-blue);
            padding:14px 36px; border-radius:50px;
            font-weight:700; font-size:0.95rem; border:2px solid var(--primary-blue); cursor:pointer;
            transition:var(--transition);
        }
        .btn-secondary:hover { background:var(--primary-blue); color:var(--white); transform:translateY(-4px); box-shadow:0 10px 30px rgba(0,56,184,0.25); }

        /* ----- HEADER – now matches footer (dark blue) ----- */
        .header {
            position:fixed; top:0; left:0; right:0; z-index:1000;
            background:var(--primary-dark-blue); /* changed to dark blue */
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid rgba(255,255,255,0.08);
            transition:var(--transition);
        }
        .header.scrolled { box-shadow:0 8px 30px rgba(0,0,0,0.2); }
        .header-inner { display:flex; align-items:center; justify-content:space-between; height:72px; }
        .logo { display:flex; align-items:center; gap:10px; font-size:1.6rem; font-weight:800; letter-spacing:-0.5px; }
        .logo .quick { color:var(--sky-blue); }  /* sky blue for dark bg */
        .logo .lick { color:var(--primary-orange); } /* orange */
        .logo img { height:40px; width:auto; }

        .nav-links { display:flex; align-items:center; gap:32px; list-style:none; }
        .nav-links a { font-size:0.9rem; font-weight:600; color:var(--white); transition:var(--transition); position:relative; }
        .nav-links a::after { content:''; position:absolute; bottom:-4px; left:0; width:0; height:2px; background:linear-gradient(90deg, var(--sky-blue), var(--bright-orange)); transition:var(--transition); }
        .nav-links a:hover { color:var(--sky-blue); }
        .nav-links a:hover::after { width:100%; }
        .nav-actions { display:flex; align-items:center; gap:16px; }
        .nav-actions .lang-toggle {
            display:flex; align-items:center; gap:4px; font-size:0.85rem; font-weight:600;
            color:var(--white); cursor:pointer; padding:6px 14px; border-radius:30px;
            background:rgba(255,255,255,0.12); transition:var(--transition); border:1px solid rgba(255,255,255,0.15);
        }
        .nav-actions .lang-toggle:hover { background:rgba(255,255,255,0.25); }
        .nav-actions .lang-toggle .flag { font-size:1.1rem; }
        .mobile-toggle { display:none; font-size:1.5rem; background:none; border:none; color:var(--white); cursor:pointer; padding:4px; }

        /* ----- HERO (unchanged) ----- */
        .hero {
            padding:160px 0 100px;
            background: linear-gradient(165deg, var(--light-blue-bg) 0%, #e6f0ff 50%, var(--light-orange-bg) 100%);
            position:relative; overflow:hidden;
        }
        .hero::before { content:''; position:absolute; top:-20%; right:-15%; width:700px; height:700px; background:radial-gradient(circle, rgba(0,56,184,0.06) 0%, transparent 70%); border-radius:50%; pointer-events:none; }
        .hero::after { content:''; position:absolute; bottom:-25%; left:-10%; width:600px; height:600px; background:radial-gradient(circle, rgba(240,96,0,0.06) 0%, transparent 70%); border-radius:50%; pointer-events:none; }
        .hero-grid { display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:center; position:relative; z-index:2; }
        .hero-content h1 { font-size:4.2rem; font-weight:900; line-height:1.05; letter-spacing:-2px; margin-bottom:20px; }
        .hero-content h1 .highlight-blue { color:var(--primary-blue); }
        .hero-content h1 .highlight-orange { color:var(--primary-orange); }
        .hero-content p { font-size:1.2rem; color:var(--dark-text); max-width:480px; margin-bottom:36px; line-height:1.7; opacity:0.8; }
        .hero-badge { display:inline-flex; align-items:center; gap:8px; background:var(--light-blue-bg); color:var(--primary-blue); padding:8px 20px; border-radius:50px; font-size:0.85rem; font-weight:700; margin-bottom:24px; border:1px solid rgba(0,56,184,0.15); }
        .hero-badge i { font-size:0.9rem; }
        .hero-buttons { display:flex; flex-wrap:wrap; gap:16px; }
        .hero-visual { display:flex; justify-content:center; align-items:center; position:relative; }
        .hero-card { background:var(--white); border-radius:var(--radius); padding:32px 28px; box-shadow:var(--shadow); width:100%; max-width:420px; border:1px solid rgba(0,0,0,0.04); transition:var(--transition); backdrop-filter:blur(4px); background:rgba(255,255,255,0.9); }
        .hero-card:hover { transform:translateY(-8px); box-shadow:var(--shadow-hover); }
        .hero-card .store-badge { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
        .hero-card .store-badge span { font-size:0.75rem; font-weight:600; color:var(--dark-text); background:var(--light-blue-bg); padding:4px 12px; border-radius:30px; }
        .hero-card .store-badge .open { background:#e8f5e9; color:#2e7d32; }
        .hero-card .store-item { display:flex; align-items:center; gap:16px; padding:14px 0; border-bottom:1px solid #f0f0f0; }
        .hero-card .store-item:last-child { border-bottom:none; }
        .hero-card .store-icon { width:48px; height:48px; border-radius:var(--radius-sm); background:var(--light-blue-bg); display:flex; align-items:center; justify-content:center; font-size:1.4rem; color:var(--primary-blue); flex-shrink:0; }
        .hero-card .store-info h4 { font-size:0.95rem; font-weight:700; }
        .hero-card .store-info p { font-size:0.8rem; color:var(--dark-text); opacity:0.6; margin:0; }
        .hero-card .store-meta { margin-left:auto; text-align:right; font-size:0.75rem; }
        .hero-card .store-meta .rating { color:var(--primary-orange); font-weight:700; }
        .hero-card .store-meta .time { color:var(--dark-text); opacity:0.5; font-size:0.7rem; }
        .hero-card .order-placed { margin-top:16px; padding:14px 18px; background:var(--light-blue-bg); border-radius:var(--radius-sm); display:flex; align-items:center; gap:12px; font-weight:700; color:var(--primary-blue); font-size:0.95rem; }
        .hero-card .order-placed i { font-size:1.2rem; color:var(--primary-orange); }

        .float-badge { position:absolute; background:var(--white); padding:10px 20px; border-radius:50px; box-shadow:var(--shadow); font-size:0.85rem; font-weight:700; display:flex; align-items:center; gap:10px; animation:float 4s ease-in-out infinite; pointer-events:none; backdrop-filter:blur(4px); }
        .float-badge-1 { top:-5px; right:-15px; color:var(--primary-blue); border:1px solid rgba(0,56,184,0.15); animation-delay:0s; }
        .float-badge-2 { bottom:50px; left:-25px; color:var(--primary-orange); border:1px solid rgba(240,96,0,0.15); animation-delay:1.5s; }
        @keyframes float { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-12px); } }

        /* ----- SECTION TITLES (unchanged) ----- */
        .section-title { text-align:center; margin-bottom:56px; }
        .section-title .label { display:inline-block; font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:2px; color:var(--primary-blue); background:var(--light-blue-bg); padding:6px 20px; border-radius:30px; margin-bottom:12px; }
        .section-title h2 { font-size:2.8rem; font-weight:800; letter-spacing:-1px; line-height:1.2; }
        .section-title h2 .blue { color:var(--primary-blue); }
        .section-title h2 .orange { color:var(--primary-orange); }
        .section-title p { color:var(--dark-text); max-width:560px; margin:12px auto 0; font-size:1.1rem; opacity:0.7; }

        /* ----- FEATURE CARDS & STATS (unchanged) ----- */
        .feature-grid {
            display:grid;
            grid-template-columns:repeat(3, 1fr);
            gap:32px;
            margin-top:48px;
        }
        .feature-card {
            background:var(--white);
            border-radius:var(--radius);
            padding:36px 28px;
            box-shadow:var(--shadow);
            transition:var(--transition);
            border:1px solid rgba(0,0,0,0.04);
            text-align:center;
        }
        .feature-card:hover {
            transform:translateY(-8px);
            box-shadow:var(--shadow-hover);
            border-color:transparent;
        }
        .feature-card .icon-wrap {
            width:72px;
            height:72px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 16px;
            font-size:2rem;
        }
        .feature-card .icon-wrap.blue { background:var(--light-blue-bg); color:var(--primary-blue); }
        .feature-card .icon-wrap.orange { background:var(--light-orange-bg); color:var(--primary-orange); }
        .feature-card .icon-wrap.purple { background:#f0ecff; color:#5e3c9b; }
        .feature-card h3 { font-size:1.3rem; font-weight:700; margin-bottom:8px; color:var(--dark-text); }
        .feature-card p { color:var(--dark-text); opacity:0.7; font-size:0.95rem; line-height:1.6; }

        .stats-grid {
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:32px;
            margin-top:64px;
        }
        .stat-card {
            text-align:center; padding:32px 20px; border-radius:var(--radius);
            background:var(--white); border:1px solid #f0f0f0;
            transition:var(--transition); position:relative; overflow:hidden;
        }
        .stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg, var(--primary-blue), var(--bright-orange)); opacity:0; transition:var(--transition); }
        .stat-card:hover { transform:translateY(-8px); box-shadow:var(--shadow-hover); border-color:transparent; }
        .stat-card:hover::before { opacity:1; }
        .stat-card .icon { font-size:2.8rem; margin-bottom:12px; display:inline-block; }
        .stat-card .icon.blue { color:var(--primary-blue); }
        .stat-card .icon.orange { color:var(--primary-orange); }
        .stat-card .number { font-size:3rem; font-weight:900; letter-spacing:-1px; line-height:1; }
        .stat-card .number .blue { color:var(--primary-blue); }
        .stat-card .number .orange { color:var(--primary-orange); }
        .stat-card .label { font-size:0.95rem; color:var(--dark-text); margin-top:6px; font-weight:600; opacity:0.7; }

        .feature-divider {
            width:80px;
            height:3px;
            background:linear-gradient(90deg, var(--primary-blue), var(--bright-orange));
            margin:56px auto 40px;
            border-radius:2px;
        }

        /* ----- OTHER SECTIONS (unchanged) ----- */
        .how-it-works { padding:80px 0; background:var(--light-blue-bg); }
        .steps-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:32px; }
        .step-card { background:var(--white); padding:40px 28px; border-radius:var(--radius); box-shadow:var(--shadow); transition:var(--transition); border:1px solid rgba(0,0,0,0.03); text-align:center; }
        .step-card:hover { transform:translateY(-10px); box-shadow:var(--shadow-hover); }
        .step-card .step-number { width:56px; height:56px; border-radius:50%; background:var(--light-blue-bg); color:var(--primary-blue); font-weight:900; font-size:1.4rem; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
        .step-card .step-icon { font-size:2.6rem; margin-bottom:12px; display:block; color:var(--primary-blue); }
        .step-card h4 { font-size:1.3rem; font-weight:700; margin-bottom:8px; color:var(--dark-text); }
        .step-card p { color:var(--dark-text); font-size:0.95rem; line-height:1.6; opacity:0.7; }
        .step-card .role-tag { display:inline-block; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; padding:4px 16px; border-radius:30px; margin-bottom:12px; }
        .step-card .role-tag.customer { background:var(--light-blue-bg); color:var(--primary-blue); }
        .step-card .role-tag.seller { background:var(--light-orange-bg); color:var(--primary-orange); }
        .step-card .role-tag.delivery { background:#e8f0fe; color:#1a56db; }

        .role-tabs { display:flex; justify-content:center; gap:12px; margin-bottom:40px; flex-wrap:wrap; }
        .role-tab { padding:12px 32px; border-radius:50px; font-weight:700; font-size:0.95rem; border:2px solid #e5e7eb; background:var(--white); cursor:pointer; transition:var(--transition); color:var(--dark-text); }
        .role-tab:hover { border-color:var(--primary-blue); color:var(--primary-blue); }
        .role-tab.active { border-color:var(--primary-blue); background:var(--primary-blue); color:var(--white); }
        .role-tab.active.orange { border-color:var(--primary-orange); background:var(--primary-orange); color:var(--white); }

        .for-everyone { padding:80px 0; background:var(--white); }
        .role-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:32px; }
        .role-card { padding:36px 28px; border-radius:var(--radius); border:1px solid #f0f0f0; transition:var(--transition); background:var(--white); }
        .role-card:hover { transform:translateY(-8px); box-shadow:var(--shadow-hover); border-color:transparent; }
        .role-card .role-header { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
        .role-card .role-header .avatar { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.8rem; flex-shrink:0; }
        .role-card .role-header .avatar.blue { background:var(--light-blue-bg); color:var(--primary-blue); }
        .role-card .role-header .avatar.orange { background:var(--light-orange-bg); color:var(--primary-orange); }
        .role-card .role-header .avatar.purple { background:#f0ecff; color:#5e3c9b; }
        .role-card .role-header h3 { font-size:1.2rem; font-weight:700; }
        .role-card .role-header h3 .blue { color:var(--primary-blue); }
        .role-card .role-header h3 .orange { color:var(--primary-orange); }
        .role-card .role-header h3 .purple { color:#5e3c9b; }
        .role-card ul { list-style:none; margin-top:8px; }
        .role-card ul li { padding:10px 0; display:flex; align-items:center; gap:12px; font-size:0.92rem; color:var(--dark-text); border-bottom:1px solid #f5f5f5; }
        .role-card ul li:last-child { border-bottom:none; }
        .role-card ul li i { color:var(--primary-blue); font-size:0.9rem; width:20px; text-align:center; }
        .role-card ul li i.orange { color:var(--primary-orange); }

        .stores-section { padding:80px 0; background:var(--light-blue-bg); }
        .stores-filter { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:36px; }
        .stores-filter button { padding:10px 28px; border-radius:50px; border:1px solid #e5e7eb; background:var(--white); font-weight:600; font-size:0.9rem; cursor:pointer; transition:var(--transition); color:var(--dark-text); }
        .stores-filter button:hover, .stores-filter button.active { border-color:var(--primary-blue); background:var(--primary-blue); color:var(--white); }
        .stores-filter button.active.orange { border-color:var(--primary-orange); background:var(--primary-orange); }
        .stores-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:24px; }
        .store-card { background:var(--white); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); transition:var(--transition); border:1px solid rgba(0,0,0,0.03); }
        .store-card:hover { transform:translateY(-6px); box-shadow:var(--shadow-hover); }
        .store-card .store-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
        .store-card .store-top .icon-box { width:48px; height:48px; border-radius:var(--radius-sm); background:var(--light-blue-bg); display:flex; align-items:center; justify-content:center; font-size:1.4rem; color:var(--primary-blue); }
        .store-card .store-top .badge-open { font-size:0.65rem; font-weight:700; text-transform:uppercase; padding:3px 12px; border-radius:30px; background:#e8f5e9; color:#2e7d32; }
        .store-card h4 { font-size:1rem; font-weight:700; margin-bottom:2px; color:var(--dark-text); }
        .store-card .store-category { font-size:0.8rem; color:var(--dark-text); opacity:0.6; }
        .store-card .store-meta { display:flex; align-items:center; gap:16px; margin-top:12px; font-size:0.8rem; color:var(--dark-text); flex-wrap:wrap; opacity:0.7; }
        .store-card .store-meta .rating { color:var(--primary-orange); font-weight:700; }
        .store-card .store-meta i { margin-right:4px; }

        .contact-section { padding:80px 0; background:var(--white); }
        .contact-grid { display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:center; }
        .contact-info h2 { font-size:2.4rem; font-weight:800; letter-spacing:-1px; line-height:1.2; margin-bottom:16px; }
        .contact-info h2 .blue { color:var(--primary-blue); }
        .contact-info h2 .orange { color:var(--primary-orange); }
        .contact-info p { color:var(--dark-text); font-size:1.05rem; margin-bottom:32px; opacity:0.7; }
        .contact-item { display:flex; align-items:center; gap:16px; padding:12px 0; border-bottom:1px solid #f0f0f0; }
        .contact-item:last-child { border-bottom:none; }
        .contact-item .icon-circle { width:44px; height:44px; border-radius:50%; background:var(--light-blue-bg); color:var(--primary-blue); display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; }
        .contact-item .icon-circle.orange { background:var(--light-orange-bg); color:var(--primary-orange); }
        .contact-item .text { font-weight:600; }
        .contact-item .text span { display:block; font-weight:400; color:var(--dark-text); opacity:0.6; font-size:0.9rem; }
        .contact-form { background:var(--light-blue-bg); padding:40px 36px; border-radius:var(--radius); border:1px solid #f0f0f0; }
        .contact-form h4 { font-size:1.2rem; font-weight:700; margin-bottom:4px; color:var(--dark-text); }
        .contact-form p { color:var(--dark-text); font-size:0.9rem; margin-bottom:20px; opacity:0.7; }
        .contact-form input, .contact-form textarea { width:100%; padding:14px 18px; border:1px solid #e5e7eb; border-radius:var(--radius-sm); font-family:inherit; font-size:0.95rem; transition:var(--transition); background:var(--white); margin-bottom:14px; }
        .contact-form input:focus, .contact-form textarea:focus { outline:none; border-color:var(--primary-blue); box-shadow:0 0 0 4px rgba(0,56,184,0.1); }
        .contact-form textarea { min-height:120px; resize:vertical; }

        /* ----- FOOTER (unchanged – already dark blue) ----- */
        .footer {
            background:var(--primary-dark-blue);
            color:rgba(255,255,255,0.8);
            padding:60px 0 30px;
        }
        .footer-grid { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:40px; margin-bottom:40px; }
        .footer-brand .logo { font-size:1.8rem; margin-bottom:12px; }
        .footer-brand .logo .quick { color:var(--sky-blue); }
        .footer-brand .logo .lick { color:var(--primary-orange); }
        .footer-brand p { font-size:0.9rem; max-width:300px; line-height:1.7; color:rgba(255,255,255,0.6); }
        .footer-col h5 { color:var(--white); font-weight:700; font-size:0.95rem; margin-bottom:16px; }
        .footer-col ul { list-style:none; }
        .footer-col ul li { margin-bottom:10px; }
        .footer-col ul a { color:rgba(255,255,255,0.6); font-size:0.9rem; transition:var(--transition); }
        .footer-col ul a:hover { color:var(--sky-blue); }
        .footer-bottom {
            border-top:1px solid rgba(255,255,255,0.06);
            padding-top:24px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:8px 20px;
            font-size:0.85rem;
            color:rgba(255,255,255,0.4);
        }
        .footer-bottom .heart { color:#FF6B6B; }

        .app-badges { display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; }
